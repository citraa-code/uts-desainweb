<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk - Concept</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="auth-container">
    <!-- Kolom Kiri: Video & Branding -->
    <section class="branding-section" aria-label="Branding dan Karya Seni">
      <video autoplay loop muted playsinline class="bg-video">
        <source src="assets/video-bg.mp4" type="video/mp4" />
      </video>
      <div class="video-overlay"></div>

      <div class="branding-content">
        <h1 class="branding-title">Temukan Desainer Kreatif Terbaik di Dunia</h1>
        <p class="branding-subtitle">Bergabunglah dengan jutaan desainer dan tim di seluruh dunia untuk membagikan, menemukan, dan tumbuh bersama.</p>
      </div>
    </section>

    <!-- Kolom Kanan: Formulir Login Disertai Logo -->
    <section class="form-section" aria-label="Formulir Autentikasi">
      <div class="form-wrapper">
        <div class="header-container">
          
          <!-- LOGO CONCEPT -->
          <a href="#" class="form-logo" aria-label="Halaman Utama Concept">
            <img src="assets/logo.svg" alt="Logo Concept" class="custom-logo" />
          </a>

          <h2 class="form-title">Masuk ke Concept</h2>
          <p class="form-subtitle">Belum punya akun? <a href="#" class="link-primary">Daftar sekarang</a></p>
        </div>

        <button type="button" class="btn-sso" aria-label="Masuk dengan akun Google">
          <svg class="sso-icon" width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Sign in with Google
        </button>

        <div class="divider" role="separator" aria-label="atau">
          <span>atau</span>
        </div>

        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <div class="label-row">
              <label for="email" class="form-label">Email atau Nama Pengguna</label>
            </div>
            <input type="email" id="email" name="email" class="form-input" placeholder="nama@contoh.com" required />
          </div>

          <div class="form-group">
            <div class="label-row">
              <label for="password" class="form-label">Kata Sandi</label>
              <a href="#" class="link-forgot">Lupa Kata Sandi?</a>
            </div>
            <input type="password" id="password" name="password" class="form-input" placeholder="Masukkan kata sandi" required />
          </div>

          <div class="form-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="remember" name="remember" class="checkbox-input" />
              <span class="checkbox-text">Ingat Saya</span>
            </label>
          </div>

          <button type="submit" class="btn-submit">Sign In</button>
        </form>
      </div>
    </section>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault(); // Mencegah reload halaman & error 405
      alert('Berhasil masuk!');
    });
  </script>
</body>
</html>
